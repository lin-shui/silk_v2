name: CI Fast Validation

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_ARGS_COMMON: --no-daemon --stacktrace --warning-mode all

jobs:
  external-agent-auth:
    name: External Agent Host + Bridges
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: silk-agent/go.mod
          cache-dependency-path: silk-agent/go.sum

      - name: Test and vet silk-agent
        working-directory: silk-agent
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c -o /tmp/silk-agent-windows.test.exe

      - name: Validate direct Bridge Host IPC
        run: |
          python3 -m pip install --disable-pip-version-check --no-input pytest
          python3 -m pytest bridge_common/tests cc_bridge/tests codex_bridge/tests -q
          python3 -m py_compile bridge_common/*.py cc_bridge/acp_adapter.py cc_bridge/executor.py codex_bridge/codex_adapter.py codex_bridge/codex_executor.py
          sh -n silk-agent/adapters/silk-claude-code-adapter silk-agent/adapters/silk-codex-adapter

  external-agent-auth-windows:
    name: External Agent Windows Security
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: silk-agent/go.mod
          cache-dependency-path: silk-agent/go.sum

      - name: Validate Windows ACL and service contracts
        working-directory: silk-agent
        run: >-
          go test .
          -run
          '^(TestSecretFileProtectedChecksWindowsDACL|TestProtectPrivateDirectoryReplacesInheritedBroadWindowsDACL|TestDeviceSignerRejectsBroadWindowsDACL|TestWindowsExecutableTrustAllowsPublicReadAndRejectsPublicWrite|TestRenderWindowsTaskAction.*|TestResolveRunConfigDir.*)$'

  gradle-fast:
    name: Backend + Web + Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use official Gradle distribution on GitHub-hosted runner
        run: |
          if grep -q 'mirrors.cloud.tencent.com' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/gradle-8.4-bin.zip#https\\://services.gradle.org/distributions/gradle-8.4-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate silk.sh syntax
        run: bash -n silk.sh

      - name: Smoke check silk.sh status
        run: ./silk.sh status

      - name: Run Silk lint
        run: ./gradlew $GRADLE_ARGS_COMMON silkLint

      - name: Run backend, packaging, web, and desktop fast validation
        run: |
          ./gradlew $GRADLE_ARGS_COMMON \
            :backend:test \
            :backend:shadowJar \
            :frontend:webApp:nodeTest \
            :frontend:webApp:compileProductionExecutableKotlinJs \
            :frontend:desktopApp:test \
            :frontend:desktopApp:compileKotlin

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            backend/build/reports/detekt
            frontend/shared/build/reports/detekt
            frontend/webApp/build/reports/detekt
            frontend/desktopApp/build/reports/detekt
            frontend/androidApp/build/reports/detekt
          if-no-files-found: ignore

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          if-no-files-found: ignore

      - name: Upload web test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-js-test-report
          path: |
            frontend/webApp/build/reports/tests/nodeTest
            frontend/webApp/build/test-results/nodeTest
          if-no-files-found: ignore

      - name: Upload desktop test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: |
            frontend/desktopApp/build/reports/tests/test
            frontend/desktopApp/build/test-results/test
          if-no-files-found: ignore

      - name: Upload backend shadowJar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shadowjar
          path: backend/build/libs/*-all.jar
          if-no-files-found: ignore

  android-compile:
    name: Android Debug Kotlin Compile
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use official Gradle distribution on GitHub-hosted runner
        run: |
          if grep -q 'mirrors.cloud.tencent.com' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/gradle-8.4-bin.zip#https\\://services.gradle.org/distributions/gradle-8.4-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Write local.properties for Android plugin evaluation
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_DIR" ]; then
            echo "Android SDK path is unavailable after setup-android" >&2
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$SDK_DIR" > local.properties

      - name: Run Android fast validation
        run: |
          ./gradlew $GRADLE_ARGS_COMMON \
            :frontend:androidApp:testDebugUnitTest \
            :frontend:androidApp:compileDebugKotlin

      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: |
            frontend/androidApp/build/reports/tests/testDebugUnitTest
            frontend/androidApp/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
