name: Release Silk Agent

on:
  push:
    tags:
      - "silk-agent-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without v prefix"
        required: true

permissions:
  contents: write

jobs:
  signed-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache-dependency-path: silk-agent/go.sum

      - name: Resolve version and signing material
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.SILK_AGENT_RELEASE_PRIVATE_KEY }}
          RELEASE_PUBLIC_KEY: ${{ secrets.SILK_AGENT_RELEASE_PUBLIC_KEY }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_PRIVATE_KEY"
          test -n "$RELEASE_PUBLIC_KEY"
          printf '%s' "$RELEASE_PRIVATE_KEY" > "$RUNNER_TEMP/silk-agent-release-private-key"
          printf '%s' "$RELEASE_PUBLIC_KEY" > "$RUNNER_TEMP/silk-agent-release-public-key"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#silk-agent-v}
          else
            version=$DISPATCH_VERSION
          fi
          printf 'SILK_AGENT_RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Test Host and release verification
        working-directory: silk-agent
        run: go test -race ./... && go vet ./...

      - name: Build and sign cross-platform bundles
        run: |
          silk-agent/scripts/package-release.sh \
            "$SILK_AGENT_RELEASE_VERSION" \
            "$RUNNER_TEMP/silk-agent-dist" \
            "$RUNNER_TEMP/silk-agent-release-private-key" \
            "$RUNNER_TEMP/silk-agent-release-public-key"

      - uses: actions/upload-artifact@v4
        with:
          name: silk-agent-${{ env.SILK_AGENT_RELEASE_VERSION }}
          path: ${{ runner.temp }}/silk-agent-dist/*
          if-no-files-found: error

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/silk-agent-dist/* \
            --verify-tag \
            --generate-notes \
            --title "Silk Agent $SILK_AGENT_RELEASE_VERSION"
